map $http_upgrade $connection_upgrade { default upgrade; '' close; }

server {
    listen 80;
    server_name _;
    root /usr/share/nginx/html;
    index index.html;

    # Subidas de aplicaciones (ZIP / carpetas)
    client_max_body_size 1024m;
    proxy_request_buffering off;

    add_header X-Content-Type-Options nosniff always;
    add_header X-Frame-Options SAMEORIGIN always;
    add_header Referrer-Policy strict-origin-when-cross-origin always;

    gzip on;
    gzip_types text/plain text/css application/javascript application/json image/svg+xml;

    location /api/ {
        proxy_pass http://backend:4000;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 1800s;
        proxy_send_timeout 1800s;
    }

    location /ws/ {
        proxy_pass http://backend:4000;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection $connection_upgrade;
        # $http_host conserva el puerto (ej. localhost:8080): el backend compara Host con el Origin del navegador
        proxy_set_header Host $http_host;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_read_timeout 3600s;
    }

    # Los archivos de /assets/ cambian de nombre en cada versión: se pueden guardar en caché mucho tiempo
    location /assets/ { expires 30d; access_log off; }
    # index.html dice qué assets cargar: el navegador debe preguntar siempre si cambió, si no después de actualizar
    # AppHub sigue mostrando la versión vieja. "expires epoch" = Cache-Control: no-cache sin usar add_header
    # (un add_header acá anularía los encabezados de seguridad de arriba).
    location / { try_files $uri $uri/ /index.html; expires epoch; }
}
