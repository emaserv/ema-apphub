map $http_upgrade $connection_upgrade { default upgrade; '' close; }
# Si adelante hay otro proxy con HTTPS (el de la empresa), las apps tienen que saber que el usuario entró por https
map $http_x_forwarded_proto $forwarded_proto { default $http_x_forwarded_proto; '' $scheme; }

server {
    listen 80;
    server_name _;
    root /usr/share/nginx/html;
    index index.html;

    # Subidas de aplicaciones (ZIP / carpetas)
    client_max_body_size 1024m;
    proxy_request_buffering off;
    # Por defecto nginx corta (408) si pasan 60 s sin recibir datos de la subida. Detrás de otro proxy
    # (que puede juntar el archivo entero antes de reenviarlo) o con conexiones lentas, eso corta los ZIP grandes.
    client_body_timeout 600s;

    add_header X-Content-Type-Options nosniff always;
    add_header X-Frame-Options SAMEORIGIN always;
    add_header Referrer-Policy strict-origin-when-cross-origin always;

    gzip on;
    gzip_types text/plain text/css application/javascript application/json image/svg+xml;

    location ^~ /api/ {
        proxy_pass http://backend:4000;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 1800s;
        proxy_send_timeout 1800s;
    }

    location ^~ /ws/ {
        proxy_pass http://backend:4000;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection $connection_upgrade;
        # $http_host conserva el puerto (ej. localhost:8080): el backend compara Host con el Origin del navegador
        proxy_set_header Host $http_host;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_read_timeout 3600s;
    }

    # Los archivos de /assets/ cambian de nombre en cada versión: se pueden guardar en caché mucho tiempo
    location ^~ /assets/ { expires 30d; access_log off; }

    # ── Interfaz de AppHub ──
    # index.html dice qué assets cargar: el navegador debe preguntar siempre si cambió, si no después de actualizar
    # AppHub sigue mostrando la versión vieja. "expires epoch" = Cache-Control: no-cache sin usar add_header
    # (un add_header acá anularía los encabezados de seguridad de arriba).
    location = / { try_files /index.html =404; expires epoch; }
    # Pantallas de AppHub: las mismas rutas que frontend/src/main.tsx y que RESERVED_PATHS en backend/src/lib/appPath.ts
    location ~ ^/(login|aplicaciones|deployments|bases-de-datos|backups|docker|git|usuarios|auditoria|configuracion)(/|$) {
        try_files /index.html =404;
        expires epoch;
    }
    # Archivos sueltos de la raíz (favicon.svg, logo-ema.png…)
    location ~ ^/[^/]+\.[a-zA-Z0-9]+$ { try_files $uri =404; expires epoch; }

    # ── Apps publicadas por ruta (ej. /holaema/) ──
    # "/holaema" → "/holaema/": sin la barra final, el navegador resuelve mal los archivos relativos de la app.
    # absolute_redirect off: redirige con una dirección relativa, así sirve detrás del proxy de la empresa (https).
    location ~ ^/[a-z0-9][a-z0-9-]*$ { absolute_redirect off; return 301 $uri/; }
    # Todo lo demás va a Traefik, que lo envía a la app dueña de la ruta (o responde 404 si no hay ninguna).
    location / {
        # Se resuelve en cada pedido (DNS interno de Docker): si Traefik se reinicia, nginx no queda apuntando a una IP vieja
        resolver 127.0.0.11 valid=30s ipv6=off;
        set $apps_upstream http://traefik:80;
        proxy_pass $apps_upstream;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $forwarded_proto;
        proxy_set_header X-Forwarded-Host $host;
        # Para que Traefik no lo confunda con un pedido a la propia AppHub (ver labels de "frontend" en docker-compose.yml)
        proxy_set_header X-Ema-Apps 1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection $connection_upgrade;
        proxy_read_timeout 3600s;
        proxy_send_timeout 1800s;
    }
}
