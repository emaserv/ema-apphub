# CI de EMA AppHub: en cada PR a master (y en cada push a master) verifica que
# backend y frontend compilen, pasen el chequeo de tipos y los tests.
name: CI

on:
  pull_request:
    branches: [master]
  push:
    branches: [master]

# Si se sube un commit nuevo mientras el CI corre, cancela la corrida anterior (ahorra minutos)
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

env:
  # Misma versión que usan backend/Dockerfile y frontend/Dockerfile: cambiarlas juntas
  NODE_VERSION: '24'

jobs:
  backend:
    name: Backend (tipos, tests, build)
    runs-on: ubuntu-latest
    timeout-minutes: 10
    defaults:
      run:
        working-directory: backend
    # Postgres descartable para los tests de API (test/api): se borra al terminar el job
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_PASSWORD: test
          POSTGRES_DB: apphub_test
        ports: ['5432:5432']
        options: >-
          --health-cmd "pg_isready -U postgres" --health-interval 2s --health-timeout 5s --health-retries 15
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm
          cache-dependency-path: backend/package-lock.json
      - run: npm ci
      - run: npm run typecheck
      - run: npm test
      - run: npm run test:api
        env:
          TEST_DATABASE_URL: postgres://postgres:test@localhost:5432/apphub_test
      - run: npm run build

  frontend:
    name: Frontend (tipos, build)
    runs-on: ubuntu-latest
    timeout-minutes: 10
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - run: npm ci
      # "build" ya incluye "tsc --noEmit" (chequeo de tipos) antes de "vite build"
      - run: npm run build
